spring.application.name=Tamizaje CENT35

# Railway asigna PORT en cada despliegue; localmente usa 8080.
server.port=${PORT:8080}

# En Railway definir estas tres variables con las credenciales de Neon.
# El fallback local usa PostgreSQL instalado en esta computadora.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tamizaje}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# Hibernate crea/actualiza las tablas a partir de las entidades JPA al iniciar.
spring.jpa.hibernate.ddl-auto=update